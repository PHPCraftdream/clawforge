name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Node ${{ matrix.node }} checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Run checks
        run: npm test

      - name: Typecheck and lint
        run: npm run format:check

      - name: Build package
        run: npm run build

      - name: Verify package contents
        run: npm run pack:check
