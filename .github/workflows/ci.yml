name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Linux Node ${{ matrix.node }} checks (integration)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24]
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install development dependencies
        run: npm ci --include=dev

      - name: Run checks
        # ubuntu-latest ships a working docker daemon: a check that requires it and still
        # cannot reach it should fail loudly, not skip (see the check runner's capability layer).
        env:
          OC_CHECK_REQUIRE: docker
        run: npm test

      - name: Typecheck and lint
        run: npm run format:check

      - name: Build package
        run: npm run build

      - name: Verify package contents
        run: npm run pack:check

  windows-checks:
    # Windows-only job: the same `npm run check` every job runs, plus typecheck/lint/build.
    # No hand-maintained path list: a check file that cannot run without a host capability
    # (a usable docker daemon, a WSL distro, a real POSIX sh, rsync) names it with a
    # `// check:requires <cap>` header, and the runner skips exactly that file on a host
    # lacking it — reported as `SKIP <label> — needs <cap>` and counted separately in the
    # closing summary, never silently. OC_CHECK_REQUIRE (unset here) would turn a skip into a
    # failure for the named capabilities instead; windows-full.yml's self-hosted WSL+Docker
    # job sets it, so a capability that job is supposed to have but cannot reach fails loudly
    # rather than quietly skipping.
    name: Windows Node ${{ matrix.node }} checks
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24]
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install development dependencies
        run: npm ci --include=dev

      - name: Run checks
        run: npm run check

      - name: Typecheck and lint
        run: npm run format:check

      - name: Build package
        run: npm run build

      - name: Verify package contents
        run: npm run pack:check
